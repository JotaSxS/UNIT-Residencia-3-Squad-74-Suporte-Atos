name: E2E Playwright

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL do frontend para testar (vazio = build local)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Instalar e compilar o frontend
        if: ${{ !inputs.base_url }}
        run: |
          npm --prefix src/frontend ci
          npm --prefix src/frontend run build

      - name: Instalar dependências do E2E
        working-directory: tests/e2e
        run: npm ci

      - name: Validar tipos dos testes
        working-directory: tests/e2e
        run: npm run typecheck

      - name: Instalar Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Preparar certificado HTTPS temporário para E2E local
        if: ${{ !inputs.base_url }}
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/supportatos-frontend.key" \
            -out "$RUNNER_TEMP/supportatos-frontend.pem" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          echo "SUPPORTATOS_HTTPS_CERT=$RUNNER_TEMP/supportatos-frontend.pem" >> "$GITHUB_ENV"
          echo "SUPPORTATOS_HTTPS_KEY=$RUNNER_TEMP/supportatos-frontend.key" >> "$GITHUB_ENV"

      - name: Executar testes E2E
        working-directory: tests/e2e
        run: npx playwright test

      - name: Publicar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/reports/
          retention-days: 14
          if-no-files-found: ignore
